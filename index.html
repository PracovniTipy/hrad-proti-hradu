<style id="ldCss">
#ld{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;overflow:hidden;
background:radial-gradient(ellipse at 50% 118%,#6b3312 0%,#34183a 36%,#0d121f 72%),#0d121f;color:#ffe6a8;font-family:Cinzel,Georgia,serif;transition:opacity .5s}
#ld.out{opacity:0;pointer-events:none}
#ld .st{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 33% 9%,#fff9,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#fff7,transparent),radial-gradient(1px 1px at 76% 12%,#fffa,transparent),radial-gradient(1.5px 1.5px at 90% 30%,#fff6,transparent),radial-gradient(1px 1px at 22% 35%,#fff6,transparent),radial-gradient(1px 1px at 68% 40%,#fff5,transparent),radial-gradient(2px 2px at 45% 14%,#fff7,transparent);animation:ldTw 3s ease-in-out infinite alternate}
#ld .gnd{position:absolute;left:0;right:0;bottom:0;height:26vh;background:radial-gradient(130% 170% at 50% 175%,#000c 55%,transparent 75%)}
#ld .em{position:absolute;bottom:-12px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#ffd98a,#ff7a2a 60%,transparent 75%);filter:blur(.4px);opacity:0;animation:ldEm linear infinite}
#ld svg{width:min(44vw,290px,46vh);height:auto;filter:drop-shadow(0 0 26px rgba(255,160,60,.22)) drop-shadow(0 7px 18px #000b)}
#ld .fl{transform-origin:0 50%;animation:ldFl 1.1s ease-in-out infinite alternate}
#ld .w{animation:ldWin 2.3s ease-in-out infinite}
#ld .w2{animation-delay:.8s}#ld .w3{animation-delay:1.5s}
#ld h1{margin:0;font-size:clamp(26px,6vw,52px);font-weight:900;letter-spacing:.06em;background:linear-gradient(100deg,#e7a83a 0%,#fff3c4 28%,#e7a83a 46%,#9a5a14 72%,#e7a83a 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0007);animation:ldShine 3.2s linear infinite}
#ld .bar{width:min(58vw,350px);height:13px;border-radius:9px;padding:2px;background:#0009;box-shadow:0 0 0 1px #090c14,0 0 0 2.5px #c9993daa,0 0 0 4px #0008,inset 0 2px 5px #000c,0 0 18px #e7a83a33;overflow:hidden}
#ld .bar i{display:block;height:100%;width:4%;border-radius:7px;background:repeating-linear-gradient(-55deg,#ffcf5e 0 9px,#f0a93c 9px 18px);background-size:26px 100%;box-shadow:inset 0 1.5px 0 #fff8,inset 0 -2px 0 #9a5a1480,0 0 12px #ffb24a;transition:width .3s;animation:ldFlow 1s linear infinite}
#ld p{margin:0;font:600 14px/1.3 "Alegreya Sans",system-ui,sans-serif;color:#e8d6b0;opacity:.85}
#ld .by{position:absolute;bottom:7px;font:700 11px "Alegreya Sans",system-ui,sans-serif;letter-spacing:.24em;color:#c9b38a88}
#ld .sw{animation:ldSw 1.4s ease-in-out infinite}
@keyframes ldFl{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1.05)}}
@keyframes ldTw{from{opacity:.5}to{opacity:1}}
@keyframes ldSw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes ldWin{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes ldShine{to{background-position:-220% 0}}
@keyframes ldFlow{to{background-position:26px 0}}
@keyframes ldEm{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:.9}100%{transform:translate(var(--dx),-108vh) scale(.25);opacity:0}}
@media (prefers-reduced-motion: reduce){#ld .em,#ld .fl,#ld .sw,#ld h1{animation:none}}
</style>

<h1>Castle WARS</h1><div class="bar"><i id="ldBar"></i></div><p id="ldTip"><span class="sw" style="display:inline-block">⚔️</span> Připravujeme bitvu…</p><div class="by">BROSWARS STUDIO</div></div>
<script>(function(){var b=document.getElementById('ldBar'),tp=document.getElementById('ldTip'),p=4,cs=/^(cs|sk)/i.test(navigator.language||'');
if(!cs)tp.lastChild.nodeValue=' Preparing the battle…';
var iv=setInterval(function(){p+= (92-p)*0.06;b.style.width=p+'%'},120);
(function(){var d=document.getElementById('ld');for(var i=0;i<16;i++){var e=document.createElement('i');e.className='em';e.style.left=(4+Math.random()*92)+'%';e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.animationDuration=(4.5+Math.random()*5)+'s';e.style.animationDelay=(Math.random()*5)+'s';var k=.5+Math.random()*1.2;e.style.width=5*k+'px';e.style.height=5*k+'px';d.appendChild(e)}})();
window.__ldDone=function(){clearInterval(iv);b.style.width='100%';var d=document.getElementById('ld');if(!d||d._x)return;d._x=1;setTimeout(function(){d.classList.add('out');setTimeout(function(){d.remove()},600)},250)};
window.addEventListener('load',function(){setTimeout(window.__ldDone,150)});setTimeout(function(){window.__ldDone&&window.__ldDone()},8000);window.addEventListener('pageshow',function(){setTimeout(function(){window.__ldDone&&window.__ldDone()},2500)})})()</script>

<section id="battle" hidden aria-label="Bitva">
  <div class="b-hud">
    <div class="hpbox me">
      <div class="lbl"><span class="hp-crest" data-ico="castle"></span><span data-i18n="your_castle">Tvůj hrad</span></div>
      <div class="hp"><b id="hpMeT" style="width:100%"></b><i id="hpMe" style="width:100%"></i></div>
      <div class="hpnum" id="hpMeNum">0 / 0</div>
    </div>
    <div class="b-center">
      <button class="hud-btn" id="bSpeed" aria-label="Rychlost hry">×1</button>
      <div class="timer-medal"><span data-ico="hourglass"></span><b id="bTimer">3:00</b></div>
      <button class="hud-btn" id="bPause" aria-label="Pauza"><span data-ico="pause"></span></button>
    </div>
    <div class="hpbox foe">
      <div class="lbl"><span id="foeName">Nepřátelský hrad</span><span class="hp-crest foe-crest" data-ico="castle"></span></div>
      <div class="hp"><b id="hpFoeT" style="width:100%"></b><i id="hpFoe" style="width:100%"></i></div>
      <div class="hpnum" id="hpFoeNum">0 / 0</div>
    </div>
  </div>
  <div class="b-stage" id="bStage">
    <canvas id="bCanvas"></canvas>
    <div class="b-orders" id="bOrders" role="group" aria-label="Rozkazy armádě">
      <button class="obtn" data-order="ustup" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-8 7 8 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="ord_retreat">Ústup</span></button>
      <button class="obtn" data-order="hradby" aria-pressed="false"><span data-ico="wall"></span><span data-i18n="ord_walls">Hradby</span></button>
      <button class="obtn" data-order="stred" aria-pressed="false"><span data-ico="flag"></span><span data-i18n="ord_center">Střed</span></button>
      <button class="obtn" data-order="utok" aria-pressed="true"><span data-i18n="ord_attack">Útok</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="b-form" id="bForm" role="group" aria-label="Rozkazy armádě">
      <button class="fbtn fbtn-sel" id="bSelect" aria-pressed="false" title="Vybrat oddíl tažením prstu"><span data-ico="select"></span><span data-i18n="squad_pick">Oddíl</span></button>
      <div class="alive-badge" title="Tvoji vojáci v bitvě"><span data-ico="helmet"></span><b id="bAlive">0</b></div>
    </div>
    <div class="b-squad" id="bSquad" hidden role="group" aria-label="Rozkazy oddílu">
      <b class="sq-name"><span data-ico="select"></span><span data-i18n="squad">Oddíl</span> <i id="sqCount">0</i></b>
      <button class="obtn sqb" data-sq="ustup" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-8 7 8 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="ord_retreat">Ústup</span></button>
      <button class="obtn sqb" data-sq="hradby" aria-pressed="false"><span data-ico="wall"></span><span data-i18n="ord_walls">Hradby</span></button>
      <button class="obtn sqb" data-sq="stred" aria-pressed="false"><span data-ico="flag"></span><span data-i18n="ord_center">Střed</span></button>
      <button class="obtn sqb" data-sq="utok" aria-pressed="false"><span data-i18n="ord_attack">Útok</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="obtn sqb sq-x" id="sqDisband" aria-label="Rozpustit oddíl">✕</button>
    </div>
    <div class="b-selhint" id="bSelHint" hidden data-i18n="squad_hint">Táhni prstem přes vojáky, které chceš dát do oddílu</div>
    <div class="b-hero" id="bHero" hidden>
      <div class="hero-info"><b id="heroName">Hrdina</b><div class="hp"><i id="heroHp" style="width:100%"></i></div>
        <button class="hb-exit" id="heroExit" data-i18n="release">Pustit</button></div>
      <div class="hero-pad">
        <button class="pb up" data-mv="up" aria-label="Nahoru">▲</button>
        <button class="pb left" data-mv="left" aria-label="Doleva">◀</button>
        <button class="pb right" data-mv="right" aria-label="Doprava">▶</button>
        <button class="pb down" data-mv="down" aria-label="Dolů">▼</button>
      </div>
      <div class="hero-acts">
        <button class="hb hb-blk" data-hact="block" aria-label="Bránit se"><span data-ico="shieldsm"></span><span data-i18n="block">Blok</span></button>
        <button class="hb hb-atk" data-hact="attack" aria-label="Útok"><span data-ico="swords"></span><span data-i18n="atk">Útok</span></button>
      </div>
    </div>
    <div class="b-boss" id="bBoss" hidden><b id="bossName"></b><div class="hp"><i id="bossHp" style="width:100%"></i></div></div>
    <div class="b-top">
      <div class="b-banner" id="bBanner"></div>
      <div class="b-wait" id="bWait" hidden data-i18n="onl_waiting">Čekám na hostitele…</div>
      <div class="b-hint" id="bHint" hidden></div>
    </div>
  </div>
  <canvas id="bMini" class="b-mini" aria-label="Minimapa bojiště"></canvas>
  <div class="b-bar">
    <div class="coins" id="bCoins"><div><span data-ico="pouch"></span><b id="bCoinNum">0</b><small id="bCoinMax"></small></div></div>
    <div class="b-units" id="bUnits"></div>
    <div class="b-abil" id="bAbil"></div>
  </div>
  <div id="bPauseMenu" class="overlay" hidden>
    <div class="modal-card panel">
      <h2 data-i18n="pause">Pauza</h2>
      <p class="muted" data-i18n="pause_text"></p>
      <div class="modal-actions snd-row" id="bSnd"></div>
      <div class="modal-actions">
        <button class="btn btn-green" id="bResume" data-i18n="resume">Pokračovat</button>
        <button class="btn btn-red" id="bQuit" data-i18n="surrender">Vzdát boj</button>
      </div>
    </div>
  </div>
</section>
