name: Stažení médií pro trailer
on:
  push:
    paths: ['tools/media.txt']
permissions:
  contents: write
jobs:
  stahni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout
        run: |
          mkdir -p /tmp/m
          grep -v '^#' tools/media.txt | while read url name; do
            [ -z "$url" ] && continue
            code=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept: image/avif,image/webp,image/png,image/*,*/*;q=0.8" -e "https://battlecastle.itch.io/" -o "/tmp/m/$name" -w "%{http_code}" "$url")
            echo "$code $name $(stat -c %s /tmp/m/$name 2>/dev/null)" | tee -a /tmp/m/log.txt
          done
      - name: Uložit do větve media
        run: |
          cd /tmp/m
          git init -q -b media
          git config user.name "PracovniTipy"
          git config user.email "dudypetr1@seznam.cz"
          git add -A && git commit -qm "media"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
