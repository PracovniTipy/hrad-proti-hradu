# Po každém nahrání hry sestaví aplikaci pro Android (APK) a zveřejní ji
# v Releases. Stáhnout jde vždy z:
#   https://github.com/PracovniTipy/hrad-proti-hradu/releases/latest/download/HradProtiHradu.apk
name: Android aplikace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Hra do složky www
        run: python3 tools/build_www.py

      - name: Capacitor projekt pro Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#1d3a7a' --iconBackgroundColorDark '#1d3a7a' --splashBackgroundColor '#0d121c' --splashBackgroundColorDark '#0d121c'
          npx cap sync android

      - name: Klíč pro podpis
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KS_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "KS_PASS=$KS_PW" >> $GITHUB_ENV
          else
            # testovací klíč z repozitáře – jen pro instalaci z webu, NE pro Google Play
            echo "KS_PATH=$GITHUB_WORKSPACE/android-klic/testovaci.keystore" >> $GITHUB_ENV
            echo "KS_PASS=hradtest" >> $GITHUB_ENV
          fi

      - name: Na šířku, celá obrazovka, verze a podpis
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 tools/android_patch.py

      - name: Sestavit APK a AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../HradProtiHradu.apk
          cp app/build/outputs/bundle/release/app-release.aab ../HradProtiHradu.aab

      - name: Zveřejnit ke stažení
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Hrad proti hradu – Android ${{ github.run_number }}
          body: |
            Aplikace pro Android. Na telefonu stáhni **HradProtiHradu.apk** a otevři ho.
            (Soubor .aab je pro nahrání do Google Play.)
          files: |
            HradProtiHradu.apk
            HradProtiHradu.aab
          make_latest: true
